<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Study Boxes dashboard preview</title>
  <desc id="desc">A clean macOS style dashboard showing study boxes, today tasks, and a session launcher.</desc>
  <rect width="960" height="640" rx="28" fill="#eef4f8"/>
  <rect x="72" y="58" width="816" height="524" rx="16" fill="#ffffff" stroke="#d4dce6"/>
  <rect x="72" y="58" width="816" height="42" rx="16" fill="#f8fafc"/>
  <circle cx="100" cy="79" r="6" fill="#ef4444"/>
  <circle cx="120" cy="79" r="6" fill="#f59e0b"/>
  <circle cx="140" cy="79" r="6" fill="#22c55e"/>

  <rect x="72" y="100" width="214" height="482" fill="#f8fafc"/>
  <text x="100" y="140" fill="#101828" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Study Boxes</text>
  <rect x="100" y="168" width="158" height="44" rx="8" fill="#101828"/>
  <text x="120" y="196" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">Probability P2</text>
  <rect x="100" y="224" width="146" height="40" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="120" y="249" fill="#667085" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Operating Systems</text>
  <rect x="100" y="276" width="146" height="40" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="120" y="301" fill="#667085" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Data Structures</text>

  <text x="326" y="150" fill="#101828" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="760">What should I study today?</text>
  <text x="328" y="180" fill="#667085" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">One click opens the exact setup for the next focused session.</text>

  <rect x="326" y="220" width="248" height="154" rx="10" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="350" y="256" fill="#0f766e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="760">TODAY</text>
  <text x="350" y="286" fill="#101828" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="760">3 pending tasks</text>
  <rect x="350" y="312" width="172" height="36" rx="8" fill="#2563eb"/>
  <text x="374" y="335" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">Start session</text>

  <rect x="604" y="220" width="220" height="154" rx="10" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="628" y="256" fill="#b45309" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="760">DEADLINE</text>
  <text x="628" y="286" fill="#101828" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="760">April 30</text>
  <text x="628" y="318" fill="#667085" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Partial exam review</text>

  <rect x="326" y="404" width="498" height="110" rx="10" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="350" y="438" fill="#101828" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="760">Resources</text>
  <rect x="350" y="462" width="104" height="30" rx="15" fill="#eef4ff"/>
  <text x="370" y="482" fill="#2563eb" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700">Moodle</text>
  <rect x="466" y="462" width="92" height="30" rx="15" fill="#ecfdf5"/>
  <text x="486" y="482" fill="#0f766e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700">PDFs</text>
  <rect x="570" y="462" width="102" height="30" rx="15" fill="#fff7ed"/>
  <text x="590" y="482" fill="#b45309" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700">Overleaf</text>
  <rect x="684" y="462" width="94" height="30" rx="15" fill="#fff1f2"/>
  <text x="704" y="482" fill="#e11d48" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700">GitHub</text>
</svg>
